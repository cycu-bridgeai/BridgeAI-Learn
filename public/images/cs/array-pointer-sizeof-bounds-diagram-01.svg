<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="aps-title aps-desc">
	<title id="aps-title">陣列在函式內退化成指標與越界示意</title>
	<desc id="aps-desc">main 裡的 readings 是連續 3 格共 12 bytes；傳進函式後只剩指向第 0 格的指標（8 bytes），每次 p+1 往後移動 4 bytes，索引 3 已經超出陣列。</desc>
	<defs>
		<marker id="aps-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
			<polygon points="0 0, 8 3, 0 6" fill="#059669"/>
		</marker>
		<marker id="aps-arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
			<polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#FFFFFF"/>

	<g font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">
		<!-- 上方括弧：main 裡的整條陣列 -->
		<path d="M90 72 V58 H510 V72" fill="none" stroke="#059669" stroke-width="1.5"/>
		<rect x="190" y="42" width="220" height="24" rx="4" fill="#FFFFFF"/>
		<text x="300" y="59" fill="#059669" font-size="13" font-weight="600">main 看得到整個陣列：共 12 bytes</text>

		<!-- 3 個合法格子 + 1 個越界格子 -->
		<rect x="90" y="86" width="140" height="76" rx="6" fill="#EBF7F3" stroke="#059669" stroke-width="1.4"/>
		<text x="160" y="112" fill="#059669" font-size="12" font-weight="600">readings[0]</text>
		<text x="160" y="142" fill="#111827" font-size="20" font-weight="700">23</text>

		<rect x="230" y="86" width="140" height="76" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
		<text x="300" y="112" fill="#6B7280" font-size="12">readings[1]</text>
		<text x="300" y="142" fill="#111827" font-size="20" font-weight="700">25</text>

		<rect x="370" y="86" width="140" height="76" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
		<text x="440" y="112" fill="#6B7280" font-size="12">readings[2]</text>
		<text x="440" y="142" fill="#111827" font-size="20" font-weight="700">24</text>

		<rect x="526" y="86" width="160" height="76" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5,4"/>
		<text x="606" y="112" fill="#DC2626" font-size="12" font-weight="600">readings[3]（界外！）</text>
		<text x="606" y="142" fill="#DC2626" font-size="16" font-weight="700">未知雜訊</text>

		<!-- p + 1 移動 4 bytes（移到右側避免與左側綠箭頭重疊） -->
		<path d="M196 166 C230 194, 268 194, 298 168" fill="none" stroke="#6B7280" stroke-width="1.4" marker-end="url(#aps-arrow-gray)"/>
		<text x="304" y="210" fill="#6B7280" font-size="12">readings + 1 往後跳 4 bytes（一格 int）</text>

		<!-- 函式收到的指標（綠箭頭在 x=126，與文字區完全錯開） -->
		<rect x="90" y="242" width="180" height="74" rx="8" fill="#F8FAFC" stroke="#111827" stroke-width="1.2"/>
		<text x="180" y="268" fill="#111827" font-size="13" font-weight="600">函式裡的參數 readings</text>
		<text x="180" y="292" fill="#6B7280" font-size="12">只是一個位址變數（8 bytes）</text>

		<path d="M126 242 V168" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#aps-arrow-green)"/>

		<!-- 結論卡片 -->
		<rect x="296" y="242" width="400" height="74" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
		<text x="496" y="268" fill="#DC2626" font-size="13" font-weight="600">函式不知道陣列有幾格</text>
		<text x="496" y="292" fill="#111827" font-size="13">在 main 算好 count 傳入，且迴圈寫 i &lt; count</text>
	</g>
</svg>
