<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="pbv-title pbv-desc">
	<title id="pbv-title">傳值呼叫與傳入位址的差別</title>
	<desc id="pbv-desc">傳值會把 5 複製到函式的獨立盒子，改動不影響 main；傳入位址則是把門牌交給指標 target，讓函式順著位址把 main 的 5 改成 3。</desc>
	<defs>
		<marker id="pbv-arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
			<polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
		</marker>
		<marker id="pbv-arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
			<polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
		</marker>
		<marker id="pbv-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
			<polygon points="0 0, 8 3, 0 6" fill="#059669"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#FFFFFF"/>

	<g font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle">
		<!-- 中央分隔線 -->
		<line x1="400" y1="24" x2="400" y2="316" stroke="#E5E7EB" stroke-width="1.2" stroke-dasharray="6,4"/>

		<!-- 左欄：傳值 -->
		<text x="200" y="38" fill="#111827" font-size="16" font-weight="600">傳入整數值（改不到外面）</text>
		<text x="200" y="58" fill="#6B7280" font-size="12">只複製了數字 5，兩個變數各自獨立</text>

		<rect x="44" y="96" width="120" height="72" rx="8" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
		<text x="104" y="122" fill="#6B7280" font-size="12">main 裡的 offset</text>
		<text x="104" y="152" fill="#111827" font-size="22" font-weight="700">5</text>

		<rect x="236" y="96" width="120" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
		<text x="296" y="122" fill="#DC2626" font-size="12">函式裡的 value</text>
		<text x="296" y="152" fill="#111827" font-size="22" font-weight="700">5 → 3</text>

		<line x1="168" y1="132" x2="230" y2="132" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#pbv-arrow-gray)"/>
		<text x="199" y="122" fill="#6B7280" font-size="11">複製值</text>

		<rect x="44" y="210" width="312" height="58" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
		<text x="200" y="235" fill="#DC2626" font-size="13" font-weight="600">函式結束後 value 消失</text>
		<text x="200" y="255" fill="#111827" font-size="13">main 裡的 offset 還是 5</text>

		<!-- 右欄：傳址 -->
		<text x="600" y="38" fill="#111827" font-size="16" font-weight="600">傳入位址（直接改回 main）</text>
		<text x="600" y="58" fill="#059669" font-size="12">把門牌抄給 target，兩邊看同一個格子</text>

		<rect x="444" y="96" width="120" height="72" rx="8" fill="#EBF7F3" stroke="#059669" stroke-width="1.4"/>
		<text x="504" y="122" fill="#059669" font-size="12">main 裡的 offset</text>
		<text x="504" y="152" fill="#111827" font-size="22" font-weight="700">5 → 3</text>

		<rect x="636" y="96" width="120" height="72" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
		<text x="696" y="122" fill="#059669" font-size="12">函式裡的 target</text>
		<text x="696" y="152" fill="#111827" font-size="15" font-weight="700">offset 位址</text>

		<path d="M568 118 H630" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#pbv-arrow-gray)"/>
		<text x="599" y="108" fill="#6B7280" font-size="11">傳 &amp;offset</text>

		<path d="M636 154 C612 184, 588 184, 568 156" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#pbv-arrow-green)"/>
		<text x="600" y="194" fill="#059669" font-size="12" font-weight="600">*target 寫回原位址</text>

		<rect x="444" y="210" width="312" height="58" rx="8" fill="#EBF7F3" stroke="#059669" stroke-width="1.2"/>
		<text x="600" y="235" fill="#059669" font-size="13" font-weight="600">回到 main 照樣有效</text>
		<text x="600" y="255" fill="#111827" font-size="13">main 裡的 offset 變成 3</text>
	</g>
</svg>
